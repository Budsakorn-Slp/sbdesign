services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbdesign}
      POSTGRES_USER: ${POSTGRES_USER:-sb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sb_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sb} -d ${POSTGRES_DB:-sbdesign}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sb}:${POSTGRES_PASSWORD:-sb_secret}@db:5432/${POSTGRES_DB:-sbdesign}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  web:
    build: ./web
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
