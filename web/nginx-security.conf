# หัวความปลอดภัยที่ต้องติดไปกับทุก response ที่ nginx เสิร์ฟเอง
# แยกไฟล์เพราะ nginx ไม่สืบทอด add_header ลงไปใน location ที่มี add_header ของตัวเอง
# ต้อง include ซ้ำทุกที่ · มีไฟล์เดียวจะได้ไม่มีที่ไหนตกหล่นแล้วไม่มีใครรู้
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
