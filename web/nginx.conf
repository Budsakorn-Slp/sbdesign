# เสิร์ฟหน้าเว็บที่ build แล้ว + ส่งต่อ API/websocket ไปที่ container "api"
#
# เส้นทางต้องตรงกับที่ vite proxy ทำไว้ตอน dev ไม่งั้นขึ้นเซิร์ฟเวอร์แล้วพังทั้งหน้า:
#   /api/xxx      -> http://api:8000/xxx       (ตัด /api ออก — ฝั่ง backend ไม่มี prefix นี้)
#   /ws/cart/xxx  -> http://api:8000/ws/cart/xxx  (ไม่ตัด · ดู web/src/lib/realtime.ts)
#   ที่เหลือ       -> index.html (SPA เป็นคนเลือกหน้าเอง)

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ซ่อนเวอร์ชัน nginx — ไม่ได้กันการโจมตี แต่ไม่ต้องบอกเขาว่าควรลองช่องโหว่ตัวไหน
  server_tokens off;

  # ไฟล์อัปโหลด/รูปจาก SAP บางตัวใหญ่ · ปล่อยค่า default 1m จะตีกลับ 413
  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # หัวความปลอดภัยสำหรับ "ไฟล์นิ่ง" — ฝั่ง API ใส่ของตัวเองอยู่แล้วใน app/main.py
  # ตรงนี้คือไฟล์ที่ nginx เสิร์ฟเอง ซึ่งไม่ได้ผ่าน middleware ของ FastAPI เลย
  #
  # ต้องเขียนซ้ำในทุก location ที่มี add_header ของตัวเอง — กฎของ nginx คือถ้า block ลูกมี
  # add_header แม้แต่บรรทัดเดียว มันจะทิ้งของที่สืบทอดมาจาก block แม่ทั้งหมด (ไม่ได้รวมกัน)
  # ลืมข้อนี้แล้ว index.html จะหลุด X-Frame-Options ไปเงียบๆ = เอาเว็บเราไปใส่ iframe หลอก
  # ให้คนกรอกรหัสได้ · ไฟล์นี้อ่านแล้วดูเหมือนปลอดภัยทั้งที่ไม่
  include /etc/nginx/snippets/sb-security.conf;

  location /api/ {
    proxy_pass http://api:8000/;      # "/" ท้าย = ตัด /api ออกก่อนส่งต่อ
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # เช็คสต็อก/ราคายิง SAP ซึ่งบางทีช้า
  }

  location /ws/ {
    proxy_pass http://api:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ตะกร้าที่เปิดค้างไว้เงียบๆ ได้นาน · ฝั่งหน้าเว็บส่ง ping ทุก 25 วิอยู่แล้ว
    proxy_read_timeout 3600s;
  }

  # ไฟล์ที่ vite ใส่ hash ไว้ในชื่อ — เปลี่ยนเนื้อหาเมื่อไรชื่อเปลี่ยนด้วย cache ยาวได้เลย
  # ใช้ add_header อย่างเดียว ไม่ใช้ "expires" คู่กัน — expires ออก Cache-Control ให้อีกชุด
  # กลายเป็นส่ง Cache-Control ซ้ำสองบรรทัดในคำตอบเดียว
  location /assets/ {
    include /etc/nginx/snippets/sb-security.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html ห้าม cache — ไม่งั้น deploy แล้วคนยังเห็นหน้าเก่าที่ชี้ไปไฟล์ที่ถูกลบไปแล้ว
  location = /index.html {
    include /etc/nginx/snippets/sb-security.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
